_wandb:
    value:
        cli_version: 0.22.2
        m: []
        python_version: 3.10.12
        t:
            "1":
                - 1
                - 12
                - 45
            "3":
                - 16
            "4": 3.10.12
            "5": 0.22.2
            "12": 0.22.2
            "13": linux-x86_64
log_interval:
    value: 1
params:
    value:
        algorithm:
            action_dim: 6
            latent_dim: 400
            lstm_dim: 256
        base_seed: 1500000
        batch_size: 24
        loss:
            entropy_weight: 0.02
            gamma: 0.99
            lambda_: 0.95
        max_episode_length: 400
        max_grad_norm: 1
        num_iterations: 2500
        num_partners: 12
        optimizer:
            betas:
                - 0.99
                - 0.99
            eps: 1e-06
            lr: 0.0001
            weight_decay: 0.1
        save_interval: 200
path:
    value:
        ckpt_path: null
        out_dir: ./out/ovc_fcp
        partner_dir: ./out
wandb:
    value:
        entity: junesong
        project: ovc
