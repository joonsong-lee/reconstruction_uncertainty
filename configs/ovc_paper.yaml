partners:
  log_interval: 1
  params:
    batch_size: 24
    base_seed: 100500
    algorithm:
    #latent_dim,lstm_dim,action_dim
      latent_dim: 400
      action_dim : 6
      lstm_dim: 256
    loss:
      entropy_weight: 0.02
      gamma: 0.99
      lambda_: 0.95
    optimizer:
      lr: 0.0001
      weight_decay: 0.1
      betas: [0.99,0.99]
      eps : 1.0e-6
      #actor_weight : 0.1
    max_grad_norm: 1.0
    max_episode_length: 400
    num_iterations: 500
    save_interval: 200
  path:
    ckpt_path: ./out/paper/ovc_7/best_model.pt
    out_dir: ./out/paper/ovc
    save_dir: ../datas/ovc_paper
  wandb:
    entity: junesong
    project: ovc_paper

recon_module:
  log_interval: 100
  save_interval: 10
  eval_every: 1000
  eval_step: 20
  early_stop: 20

  params:
    batch_size: 16
    num_worker: 8
    epochs: 200
    decay_lr: true
    grad_clip: 1.0
    
    model:
      in_features: 512
      out_units: 1640
      num_classes: 20
      gpt_config:
        input_size: 975
        batch_size: ${recon_module.params.batch_size}
        frame_length: 400
        n_layer: 4
        n_head: 16 #in features // n head should be even for rope
        n_embd: ${recon_module.params.model.in_features}
        dropout: 0.0
        bias: true

    optimizer:
      betas: [0.9,0.95]
      lr: 1.0e-05
      weight_decay: 0.1
      eps: 1.0e-6
    
    scheduler:
      lr_decay_iters: 200000
      min_lr: 6.0e-05
      warmup_iters: 5000
      wm_learning_rate: ${recon_module.params.optimizer.lr}

    dataset:
      data_dir: ${recon_module.path.data_dir}
      
  path:
    ckpt_path: ./out/paper/ovc_recon_classification/best_model.pt
    data_dir: ../datas/ovc_paper
    out_dir: ./out/paper/ovc_recon_classification_noev
  wandb:
    entity: ${partners.wandb.entity}
    project: ${partners.wandb.project}_recon


fcp:
  log_interval: 1
  params:
    batch_size: 24
    num_partners: 8
    base_seed: 1500000
    algorithm:
    #latent_dim,lstm_dim,action_dim
      latent_dim: 400
      action_dim : 6
      lstm_dim: 256
    loss:
      entropy_weight: 0.02
      gamma: 0.99
      lambda_: 0.95
    optimizer:
      lr: 0.0001
      weight_decay: 0.1
      betas: [0.99,0.99]
      eps : 1.0e-6
      #actor_weight : 0.1
    max_grad_norm: 1.0
    max_episode_length: 400
    num_iterations: 50000
    save_interval: 200
  path:
    ckpt_path: ./out/paper/ovc_fcp/best_model.pt
    partner_dir: ./out/paper
    out_dir: ./out/paper/ovc_fcp
  wandb:
    entity: junesong
    project: ovc_paper

fcp_recon:
  log_interval: 5
  params:
    batch_size: 4
    buffer_size: 2000
    added_dim: 2
    num_partners: 8
    base_seed: 1500000
    algorithm:
    #latent_dim,lstm_dim,action_dim
      latent_dim: 320
      added_dim: ${fcp_recon.params.added_dim}
      action_dim : 6
      lstm_dim: 256
    loss:
      entropy_weight: 0.01
      gamma: 0.99
      lambda_: 0.95
    optimizer:
      lr: 0.0001
      weight_decay: 0.1
      betas: [0.99,0.99]
      eps : 1.0e-6
      #actor_weight : 0.1
    max_grad_norm: 1.0
    max_episode_length: 400
    num_iterations: 50000
    save_interval: 200
  path:
    ckpt_path: ./out/paper/ovc_0/best_model.pt
    recon_ckpt_path: ./out/paper/ovc_fcp_recon_learning/best_recon_model.pt
    partner_dir: ./out/paper
    out_dir: ./out/paper/ovc_fcp_recon_nolstm
  wandb:
    entity: junesong
    project: ovc_paper
